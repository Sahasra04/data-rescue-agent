<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Rescue Agent</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
            background: #0f1117;
            color: #e5e7eb;
        }
        h1 { font-size: 28px; margin-bottom: 4px; }
        p.subtitle { color: #9ca3af; margin-top: 0; }
        .card {
            background: #1a1d27;
            border-radius: 12px;
            padding: 24px;
            margin-top: 24px;
            border: 1px solid #2a2e3a;
        }
        input[type="file"] {
            margin: 16px 0;
            color: #e5e7eb;
        }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 8px;
        }
        button:hover { background: #4338ca; }
        button.secondary {
            background: #2a2e3a;
        }
        button.secondary:hover { background: #363b4a; }
        pre {
            white-space: pre-wrap;
            background: #0f1117;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #2a2e3a;
            font-size: 13px;
            line-height: 1.5;
        }
        .error {
            color: #f87171;
            margin-top: 12px;
        }
        .download-btn {
            display: inline-block;
            margin-top: 12px;
            background: #16a34a;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
        }
        .download-btn:hover { background: #15803d; }
    </style>
</head>
<body>
    <h1>🧹 Data Rescue Agent</h1>
    <p class="subtitle">Upload a messy CSV, Excel, or JSON file. Gemini finds and fixes the problems.</p>

    <div class="card">
        <form action="/analyze" method="post" enctype="multipart/form-data">
            <input type="file" name="data_file" accept=".csv,.xlsx,.json" required>
            <br>
            <button type="submit" name="action" value="detect">Analyze Only</button>
            <button type="submit" name="action" value="fix">Clean &amp; Fix</button>
        </form>
    </div>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if result %}
        <div class="card">
            <h3>{{ action }} Result</h3>
            <pre>{{ result }}</pre>
            {% if download_ready %}
                <a class="download-btn" href="/download/{{ download_name }}">⬇ Download Cleaned File</a>
            {% endif %}
        </div>
    {% endif %}
</body>
</html>
